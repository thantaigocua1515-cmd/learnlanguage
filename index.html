<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LingoLearning - Nền tảng học Tiếng Đức & Đa Ngôn Ngữ</title>

  <!-- Google Fonts: Plus Jakarta Sans for crystal clear legibility -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 CDN (NO Tailwind CSS) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Gamification & Theme Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/games.css">
</head>
<body>

  <!-- Top Sticky Navbar -->
  <nav class="app-navbar py-2 px-3">
    <div class="container-xl d-flex align-items-center justify-content-between">
      
      <!-- Brand Logo -->
      <a href="#" class="brand-logo" id="nav-brand">
        <div class="brand-icon">
          <i class="bi bi-mortarboard-fill"></i>
        </div>
        <span>Lingo<span class="text-primary">Learning</span></span>
      </a>

      <!-- Gamification Stats Pills (Streak, XP, Hearts) -->
      <div class="d-none d-md-flex align-items-center gap-2">
        <div class="stat-pill stat-streak" title="Chuỗi ngày học liên tục">
          <i class="bi bi-fire fs-5"></i>
          <span id="nav-streak-count">5</span>
        </div>
        <div class="stat-pill stat-xp" title="Điểm kinh nghiệm tích lũy">
          <i class="bi bi-star-fill fs-5"></i>
          <span id="nav-xp-count">240</span> XP
        </div>
        <div class="stat-pill stat-hearts" title="Năng lượng làm bài">
          <i class="bi bi-heart-fill fs-5"></i>
          <span id="nav-hearts-count">5/5</span>
        </div>
      </div>

      <!-- Right Action Controls -->
      <div class="d-flex align-items-center gap-2">
        <!-- Language Switcher -->
        <div class="dropdown">
          <button class="btn btn-sm btn-outline-secondary dropdown-toggle d-flex align-items-center gap-1 rounded-pill px-3" type="button" data-bs-toggle="dropdown">
            <span class="fs-6">🇩🇪</span> <span class="fw-bold d-none d-sm-inline">Deutsch (de)</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow-sm">
            <li><a class="dropdown-item active fw-bold" href="#"><span class="me-2">🇩🇪</span> Tiếng Đức (Deutsch)</a></li>
            <li><a class="dropdown-item disabled text-muted" href="#"><span class="me-2">🇬🇧</span> Tiếng Anh (English) - Sắp có</a></li>
            <li><a class="dropdown-item disabled text-muted" href="#"><span class="me-2">🇯🇵</span> Tiếng Nhật (日本語) - Sắp có</a></li>
            <li><a class="dropdown-item disabled text-muted" href="#"><span class="me-2">🇨🇳</span> Tiếng Trung (中文) - Sắp có</a></li>
          </ul>
        </div>

        <!-- Dark/Light Theme Toggle Button -->
        <button class="btn btn-sm btn-outline-secondary rounded-circle" id="theme-toggle-btn" title="Chuyển chế độ Sáng / Tối" style="width: 36px; height: 36px;">
          <i class="bi bi-moon-stars-fill" id="theme-toggle-icon"></i>
        </button>

        <!-- AdminCP Link Button -->
        <a href="admin.html" class="btn btn-3d btn-3d-warning btn-3d-sm d-none d-sm-inline-flex" title="Quản trị hệ thống SaaS">
          <i class="bi bi-gear-wide-connected"></i> AdminCP
        </a>
      </div>

    </div>
  </nav>

  <!-- Main Dynamic View Container -->
  <main class="container-xl py-4" id="main-app-content">
    <!-- Populated dynamically by app.js -->
  </main>

  <!-- Mobile Bottom Navigation Bar (App Experience) -->
  <div class="mobile-bottom-nav">
    <a href="#" class="mobile-nav-item active" data-nav-target="learn">
      <i class="bi bi-book-half"></i>
      <span>Bài học</span>
    </a>
    <a href="#" class="mobile-nav-item" data-nav-target="games">
      <i class="bi bi-controller"></i>
      <span>Trò chơi</span>
    </a>
    <a href="#" class="mobile-nav-item" data-nav-target="flashcards">
      <i class="bi bi-card-text"></i>
      <span>Thẻ nhớ</span>
    </a>
    <a href="admin.html" class="mobile-nav-item">
      <i class="bi bi-gear-fill"></i>
      <span>AdminCP</span>
    </a>
  </div>

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Bootstrap 5.3 Bundle JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Application Entry Script (ES6 Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
