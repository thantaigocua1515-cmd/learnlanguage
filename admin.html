<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LingoLearning AdminCP - SaaS Control Panel</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 CDN (NO Tailwind CSS) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Theming & Admin Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <div class="admin-layout">
    <!-- SaaS Modern Sidebar -->
    <aside class="admin-sidebar">
      <!-- Brand Header -->
      <div class="d-flex align-items-center gap-2 mb-4 px-2">
        <div class="brand-icon">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <div>
          <div class="fw-bold fs-5 lh-1">Lingo<span class="text-primary">Admin</span></div>
          <span class="badge bg-primary-subtle text-primary border border-primary-subtle" style="font-size: 0.65rem;">SaaS v1.0</span>
        </div>
      </div>

      <!-- Navigation Menu -->
      <nav class="flex-grow-1">
        <div class="text-muted small fw-bold text-uppercase px-2 mb-2" style="font-size: 0.72rem;">Tổng quan & Quản trị</div>
        
        <div class="admin-nav-item active" data-tab="dashboard">
          <i class="bi bi-grid-1x2-fill"></i>
          <span>Dashboard & KPIs</span>
        </div>

        <div class="admin-nav-item" data-tab="tatoeba">
          <i class="bi bi-cloud-arrow-down-fill text-primary"></i>
          <span>Tatoeba Importer</span>
        </div>

        <div class="admin-nav-item" data-tab="vocabulary">
          <i class="bi bi-translate"></i>
          <span>Quản lý Từ Vựng</span>
        </div>

        <div class="admin-nav-item" data-tab="sentences">
          <i class="bi bi-chat-quote-fill"></i>
          <span>Kho Câu Mẫu</span>
        </div>

        <div class="text-muted small fw-bold text-uppercase px-2 mt-4 mb-2" style="font-size: 0.72rem;">Hệ thống & Cấu hình</div>

        <div class="admin-nav-item" data-tab="supabase">
          <i class="bi bi-database-fill text-success"></i>
          <span>Cấu hình Supabase</span>
        </div>

        <a href="index.html" class="admin-nav-item text-secondary mt-2">
          <i class="bi bi-arrow-left-circle"></i>
          <span>Về trang Học viên</span>
        </a>
      </nav>

      <!-- Sidebar Footer (Logged in profile) -->
      <div class="border-top pt-3 px-2">
        <div class="d-flex align-items-center justify-content-between">
          <div class="d-flex align-items-center gap-2">
            <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-bold" style="width: 34px; height: 34px;">
              A
            </div>
            <div>
              <div class="fw-bold small lh-1">Senior Admin</div>
              <span class="text-success small" style="font-size: 0.75rem;">● Online</span>
            </div>
          </div>
          <!-- Dark/Light theme toggle in admin -->
          <button class="btn btn-sm btn-outline-secondary rounded-circle" id="admin-theme-toggle" style="width: 32px; height: 32px;">
            <i class="bi bi-moon-fill" id="admin-theme-icon"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content Panel -->
    <main class="admin-main">
      <div id="admin-view-container">
        <!-- Rendered dynamically by js/admin.js -->
      </div>
    </main>
  </div>

  <!-- Modal: Add / Edit Vocabulary -->
  <div class="modal fade" id="vocabModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content gamify-card">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold" id="vocabModalTitle">Thêm Từ Vựng Tiếng Đức</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="vocabForm">
            <input type="hidden" id="form-vocab-id">
            <div class="row g-2 mb-3">
              <div class="col-8">
                <label class="form-label small fw-bold">Từ vựng (Word) *</label>
                <input type="text" class="form-control form-control-gamify" id="form-word" required placeholder="ví dụ: Apfel">
              </div>
              <div class="col-4">
                <label class="form-label small fw-bold">Giống (Gender)</label>
                <select class="form-select form-select-gamify" id="form-gender">
                  <option value="">(Không có)</option>
                  <option value="der">der (Maskulin - Xanh)</option>
                  <option value="die">die (Feminin - Đỏ)</option>
                  <option value="das">das (Neutral - Xanh lá)</option>
                </select>
              </div>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label small fw-bold">Số nhiều (Plural)</label>
                <input type="text" class="form-control form-control-gamify" id="form-plural" placeholder="ví dụ: die Äpfel">
              </div>
              <div class="col-6">
                <label class="form-label small fw-bold">Phiên âm IPA</label>
                <input type="text" class="form-control form-control-gamify" id="form-ipa" placeholder="ví dụ: /ˈapfl̩/">
              </div>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label small fw-bold">Cấp độ CEFR *</label>
                <select class="form-select form-select-gamify" id="form-level" required>
                  <option value="A1">A1 - Khởi đầu</option>
                  <option value="A2">A2 - Cơ bản</option>
                  <option value="B1">B1 - Trung cấp</option>
                  <option value="B2">B2 - Trung cao cấp</option>
                  <option value="C1">C1 - Cao cấp</option>
                  <option value="C2">C2 - Thành thạo</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label small fw-bold">Từ loại (POS)</label>
                <input type="text" class="form-control form-control-gamify" id="form-pos" value="Noun">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Nghĩa Tiếng Việt *</label>
              <input type="text" class="form-control form-control-gamify" id="form-meaning-vi" required placeholder="ví dụ: Quả táo">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Câu ví dụ Tiếng Đức (Example)</label>
              <textarea class="form-control form-control-gamify" id="form-example-de" rows="2" placeholder="Der Apfel ist rot."></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Dịch câu ví dụ Tiếng Việt</label>
              <input type="text" class="form-control form-control-gamify" id="form-example-vi" placeholder="Quả táo có màu đỏ.">
            </div>
          </form>
        </div>
        <div class="modal-footer border-top">
          <button type="button" class="btn btn-3d btn-3d-outline btn-3d-sm" data-bs-dismiss="modal">Hủy</button>
          <button type="button" class="btn btn-3d btn-3d-primary btn-3d-sm" id="btn-save-vocab">Lưu Từ Vựng</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Bootstrap 5.3 Bundle JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Admin Controller Script (ES6 Module) -->
  <script type="module" src="js/admin.js"></script>
</body>
</html>
